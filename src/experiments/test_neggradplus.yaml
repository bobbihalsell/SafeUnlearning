model: 
  name: resnet18
  pretrained: false
  num_classes: 10
unlearner:
  name: neggradplus
  cfg:
    num_epochs: 3
    lr: 0.01
    weight_decay: 0
    use_l2_penalty: true
    evaluate: true
    beta: 0.4
dataset:
  name: cifar10
  val_ratio: 0.0
forget_method:
  name: index
  parameters: [0]
seed: 40
batch_size: 32