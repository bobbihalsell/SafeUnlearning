model:
  name: mobilenet_v2
  pretrained: true  # Use library-provided pretrained weights.
  num_classes: 10
  save_dir: ./artifacts/models # directory to save the trained model
  train_cfg:  # Will use Adam only for now
    epochs: 10
    lr: 0.01
    weight_decay: 0
dataset:
  name: cifar10
  load_dir: ./data # directory to the ImageFolder-format dataset
  batch_sizes:
    train: 64
    val: 64
    test: 64
seed: 42
