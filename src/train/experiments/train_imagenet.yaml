model:
  name: mobilenet_v2
  pretrained: true  # Start from library-provided pretrained weights.
  freeze_all_except_classifier: false
  num_classes: 200
  checkpoint_path: # Path to model weights if you want to start training from self-provided weights
  save_dir: ./artifacts/models/imagenet # directory to save the trained model
  train_cfg:  # Will use Adam only for now
    epochs: 2
    lr: 0.001
    weight_decay: 0.0001
dataset:
  name: imagenet
  load_dir: ./imagenet # directory to the ImageFolder-format dataset
  batch_sizes:
    train: 64
    val: 64
    test: 64
  num_workers: 4
seed: 42
run_id: imagenet_trial