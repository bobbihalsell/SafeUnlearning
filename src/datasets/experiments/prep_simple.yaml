dataset:
  name: cifar10  # Options: cifar10, cifar5, cifar100, imagenet
  url: # must end in .tar or .tar.gz, and only supported if name is imagenet
  save_dir: ./data # the directory filepath where the dataset should be saved OR is saved and should be loaded in from. 
  proportion: 1 # Choose 1 to use all data. Data will always be balanced.
  val_ratio: 0.2
  cfg:
    batch_sizes:
      retain: 32
      forget: 32
      val: 32
      train: 64
      test: 64
    num_workers: 1
forget:
  method: instances
  parameters: [1]