name: scrub
evaluate: true
cfg:
  optimizer: adam
  lr: 0.0005
  lr_decay: 0.1
  momentum: 0.9
  weight_decay: 0.1
  use_l2_penalty: false
  min_epochs: 3  # For scrub  retain aligning steps
  max_epochs: 2  # For scrub  forget away steps
  alpha: 0.5  # For scrub  retain loss; gamma: cross-entropy weight
  gamma: 0.5  # For scrub  retain loss; alpha: KL divergence weight