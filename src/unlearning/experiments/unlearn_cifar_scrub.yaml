model:
  name: mobilenet_v2
  num_classes: 10
  model_ckpt_path: ./artifacts/models/cifar/mobilenet_v2_42_original.pt  # You must specify a path to the original model.
unlearner:
  name: scrub  # Options: neggrad, neggradplus, scrub, euk, cfk, finetune
  evaluate: true
  cfg:
    # Common parameters for all unlearners
    lr: 0.001
    weight_decay: 0
    use_l2_penalty: false
    # Specific parameters for some unlearners (will be ignored for others)
    min_epochs: 2  # For scrub  retain aligning steps
    max_epochs: 5  # For scrub  forget away steps
    alpha: 0.5  # For scrub  retain loss; gamma: cross-entropy weight
    gamma: 0.5  # For scrub  retain loss; alpha: KL divergence weight
dataset:
  name: cifar10  # Options: cifar10, cifar5, cifar100, imagenet
  save_path: ./data # the directory filepath where the dataset should be loaded in from. 
  cfg:
    batch_sizes:
      retain: 32
      forget: 32
      val: 32
    num_workers: 1
seed: 42
output_dir: ./artifacts
verbose: true