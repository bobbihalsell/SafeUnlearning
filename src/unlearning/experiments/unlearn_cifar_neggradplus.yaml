model:
  name: mobilenet_v2
  num_classes: 10
  model_ckpt_path: ./artifacts/models/cifar/mobilenet_v2_42_original.pt  # You must specify a path to the original model.
unlearner:
  name: neggradplus  # Options: neggrad, neggradplus, scrub, euk, cfk, finetune
  evaluate: true
  cfg:
    # Common parameters for all unlearners
    lr: 0.01
    weight_decay: 0
    use_l2_penalty: false
    epochs: 1 # Ignored for scrub
    beta: 0.95  # For neggradplus  beta = 0: forget only, beta = 1: retain only
dataset:
  name: cifar10  # Options: cifar10, cifar5, cifar100, imagenet
  save_path: ./data # the directory filepath where the dataset should be loaded in from. 
  cfg:
    batch_sizes:
      retain: 32
      forget: 1
      val: 32
    num_workers: 1
seed: 42
output_dir: ./artifacts
verbose: true