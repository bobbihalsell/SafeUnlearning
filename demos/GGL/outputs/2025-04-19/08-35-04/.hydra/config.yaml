seed: 42
verbose: true
output_dir: ./artifacts/models
id: '006'
model:
  load_method: torchvision
  model_name: resnet18
  model_ckpt_path: artifacts/models/resnet18_42_original.pt
dataset:
  name: imagenet
  num_classes: 1000
  save_path: imagenet_example_split
  cfg:
    batch_sizes:
      retain: 64
      forget: 64
      val: 64
    num_workers: 4
unlearner:
  name: neggrad
  evaluate: false
  cfg:
    optimizer: sgd
    lr: 0.001
    momentum: null
    lr_decay_factor: 0
    epochs_per_lr_decay: 2
    weight_decay: 0
    use_l2_penalty: false
    epochs: 1
wandb_cfg:
  project_name: machine_unlearning_001
  run_id: neggrad_job_004
