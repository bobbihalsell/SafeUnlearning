experiment_name: reconstruction_experiment
original_weights: artifacts/models/unlearn/neggrad/resnet18_42_original_004.pt
unlearned_weights: artifacts/models/unlearn/neggrad/resnet18_42_unlearned_004.pt
output_dir: ./artifacts/
seed: 42
verbose: true
data:
  model_name: resnet18
  dataset_name: imagenet
  labels:
  - 12
  num_classes: 1000
  data_root: imagenet_example_split/forget
reconstructor:
  type: ggl
  lr: 0.001
  cfg:
    num_updates: 1
    unlearning_method: neggrad
    batch_size: 1
    loss_models: l2
    budget: 1000
    search_dim: 128
    use_tanh: false
    gp_optim: AdamW
    use_scheduler: true
    initial_lr: 1
    initial_z_path: null
  unlearner:
    alpha: None
    gamma: None
    min_epochs: None
    max_epochs: None
    weight_decay: 0
    use_l2_penalty: false
    optimizer: sgd
    momentum: 0
    lr_decay_factor: null
    epochs_per_lr_decay: null
wandb_cfg:
  project: MU reconstruction
  extra_config:
    unlearning_method: neggrad
    epochs: 1
