hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - data=imagenet
    - reconstructor=ggl
    - original_weights=artifacts/models/unlearn/scrub/resnet18_42_original_004.pt
    - unlearned_weights=artifacts/models/unlearn/scrub/resnet18_42_unlearned_004.pt
    - data.model_name=resnet18
    - data.labels=[12]
    - data.data_root=imagenet_example_split/forget
    - reconstructor.cfg.budget=5000
    - reconstructor.lr=0.001
    - reconstructor.cfg.unlearning_method=scrub
    - reconstructor.unlearner.alpha=1
    - reconstructor.unlearner.gamma=0.5
    - reconstructor.unlearner.min_epochs=0
    - reconstructor.unlearner.max_epochs=1
    - reconstructor.cfg.initial_lr=5
    - +wandb_cfg=default
    - +wandb_cfg.extra_config.unlearning_method=scrub
    - +wandb_cfg.extra_config.epochs=1
  job:
    name: main_reconstructor
    chdir: null
    override_dirname: +wandb_cfg.extra_config.epochs=1,+wandb_cfg.extra_config.unlearning_method=scrub,+wandb_cfg=default,data.data_root=imagenet_example_split/forget,data.labels=[12],data.model_name=resnet18,data=imagenet,original_weights=artifacts/models/unlearn/scrub/resnet18_42_original_004.pt,reconstructor.cfg.budget=5000,reconstructor.cfg.initial_lr=5,reconstructor.cfg.unlearning_method=scrub,reconstructor.lr=0.001,reconstructor.unlearner.alpha=1,reconstructor.unlearner.gamma=0.5,reconstructor.unlearner.max_epochs=1,reconstructor.unlearner.min_epochs=0,reconstructor=ggl,unlearned_weights=artifacts/models/unlearn/scrub/resnet18_42_unlearned_004.pt
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /vol/bitbucket/oap24/demo/safe-unlearning/demos/GGL
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /vol/bitbucket/oap24/demo/safe-unlearning/src/attacks/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /vol/bitbucket/oap24/demo/safe-unlearning/demos/GGL/outputs/2025-04-19/08-40-13
    choices:
      wandb_cfg: default
      reconstructor: ggl
      data: imagenet
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
