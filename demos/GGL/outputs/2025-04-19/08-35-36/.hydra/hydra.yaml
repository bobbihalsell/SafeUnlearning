hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - dataset=imagenet
    - model=resnet18
    - model=torchvision
    - unlearner=neggrad
    - dataset.save_path=imagenet_example_split
    - model.model_name=resnet18
    - model.model_ckpt_path=artifacts/models/resnet18_42_original.pt
    - unlearner.cfg.lr=0.001
    - unlearner.cfg.lr_decay_factor=0
    - unlearner.cfg.epochs=1
    - unlearner.evaluate=false
    - +wandb_cfg=default
    - ++wandb_cfg.run_id=neggrad_job_006
  job:
    name: main
    chdir: null
    override_dirname: ++wandb_cfg.run_id=neggrad_job_006,+wandb_cfg=default,dataset.save_path=imagenet_example_split,dataset=imagenet,model.model_ckpt_path=artifacts/models/resnet18_42_original.pt,model.model_name=resnet18,model=resnet18,model=torchvision,unlearner.cfg.epochs=1,unlearner.cfg.lr=0.001,unlearner.cfg.lr_decay_factor=0,unlearner.evaluate=false,unlearner=neggrad
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /vol/bitbucket/oap24/demo/safe-unlearning/demos/GGL
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /vol/bitbucket/oap24/demo/safe-unlearning/src/unlearning/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /vol/bitbucket/oap24/demo/safe-unlearning/demos/GGL/outputs/2025-04-19/08-35-36
    choices:
      wandb_cfg: default
      unlearner: neggrad
      dataset: imagenet
      model: torchvision
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
