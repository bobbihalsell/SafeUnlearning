experiment_name: reconstruction_experiment
original_weights: artifacts/models/unlearn/scrub/resnet18_42_original.pt
unlearned_weights: artifacts/models/unlearn/scrub/resnet18_42_unlearned.pt
output_dir: ./artifacts/
seed: 42
verbose: true
data:
  model_name: resnet18
  dataset_name: imagenet
  labels:
  - 12
  num_classes: 1000
  data_root: imagenet_example_split/forget
reconstructor:
  type: ggl
  lr: 0.001
  cfg:
    num_updates: 1
    unlearning_method: scrub
    batch_size: 1
    loss_models: l2
    budget: 5000
    search_dim: 128
    use_tanh: false
    gp_optim: AdamW
    use_scheduler: true
    initial_lr: 5
    initial_z_path: null
  unlearner:
    alpha: 1
    gamma: 0.5
    min_epochs: 0
    max_epochs: 1
    weight_decay: 0
    use_l2_penalty: false
    optimizer: sgd
    momentum: 0
    lr_decay_factor: null
    epochs_per_lr_decay: null
wandb_cfg:
  project: MU reconstruction
  extra_config:
    unlearning_method: scrub
    epochs: 1
